<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Source Switching Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .button { padding: 10px 15px; margin: 5px; background: #0073aa; color: white; border: none; border-radius: 3px; cursor: pointer; }
        .button:hover { background: #005a87; }
        .results { margin-top: 10px; padding: 10px; background: #f9f9f9; border-radius: 3px; white-space: pre-wrap; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Data Source Switching Test</h1>
    
    <div class="test-section">
        <h2>Switch Data Source</h2>
        <p>Current data source: <span id="currentSource">Loading...</span></p>
        <button class="button" onclick="switchToDatabase()">Switch to Database</button>
        <button class="button" onclick="switchToGoogleSheets()">Switch to Google Sheets</button>
        <div id="switchResults" class="results"></div>
    </div>
    
    <div class="test-section">
        <h2>Test Unified Endpoint</h2>
        <button class="button" onclick="testUnifiedEndpoint()">Test /get-data Endpoint</button>
        <div id="unifiedResults" class="results"></div>
    </div>
    
    <div class="test-section">
        <h2>Debug Database Info</h2>
        <button class="button" onclick="debugDatabase()">Get Database Info</button>
        <div id="debugResults" class="results"></div>
    </div>

    <script>
        const wpRoot = 'http://localhost/wp-dev';

        // Function to get current data source
        async function getCurrentSource() {
            try {
                const response = await fetch(`${wpRoot}/wp-json/jq-stockists/v1/debug-db`);
                const data = await response.json();
                document.getElementById('currentSource').textContent = data.data_source_setting;
                return data.data_source_setting;
            } catch (error) {
                document.getElementById('currentSource').textContent = 'Error loading';
                console.error('Error getting current source:', error);
            }
        }

        // Initialize
        getCurrentSource();

        // Switch to database
        async function switchToDatabase() {
            const results = document.getElementById('switchResults');
            results.textContent = 'Switching to database...';
            
            try {
                // This is a simplified approach - in real WordPress admin this would be done via settings form
                const response = await fetch(`${wpRoot}/wp-json/wp/v2/options`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        blf_data_source: 'database'
                    })
                });
                
                if (response.ok) {
                    results.className = 'results success';
                    results.textContent = 'Successfully switched to database';
                    getCurrentSource();
                } else {
                    results.className = 'results error';
                    results.textContent = 'Failed to switch (may need admin authentication)';
                }
            } catch (error) {
                results.className = 'results error';
                results.textContent = `Error: ${error.message}`;
            }
        }

        // Switch to Google Sheets
        async function switchToGoogleSheets() {
            const results = document.getElementById('switchResults');
            results.textContent = 'Switching to Google Sheets...';
            
            try {
                const response = await fetch(`${wpRoot}/wp-json/wp/v2/options`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        blf_data_source: 'google_sheets'
                    })
                });
                
                if (response.ok) {
                    results.className = 'results success';
                    results.textContent = 'Successfully switched to Google Sheets';
                    getCurrentSource();
                } else {
                    results.className = 'results error';
                    results.textContent = 'Failed to switch (may need admin authentication)';
                }
            } catch (error) {
                results.className = 'results error';
                results.textContent = `Error: ${error.message}`;
            }
        }

        // Test unified endpoint
        async function testUnifiedEndpoint() {
            const results = document.getElementById('unifiedResults');
            results.textContent = 'Testing unified endpoint...';
            
            try {
                const response = await fetch(`${wpRoot}/wp-json/jq-stockists/v1/get-data`);
                const contentType = response.headers.get('content-type');
                
                let data;
                if (contentType && contentType.includes('application/json')) {
                    data = await response.json();
                    results.textContent = `JSON Response (Database):\n${JSON.stringify(data, null, 2)}`;
                } else {
                    data = await response.text();
                    results.textContent = `CSV Response (Google Sheets):\n${data.substring(0, 500)}${data.length > 500 ? '...' : ''}`;
                }
                
                results.className = 'results success';
            } catch (error) {
                results.className = 'results error';
                results.textContent = `Error: ${error.message}`;
            }
        }

        // Debug database
        async function debugDatabase() {
            const results = document.getElementById('debugResults');
            results.textContent = 'Getting database info...';
            
            try {
                const response = await fetch(`${wpRoot}/wp-json/jq-stockists/v1/debug-db`);
                const data = await response.json();
                results.className = 'results success';
                results.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                results.className = 'results error';
                results.textContent = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
