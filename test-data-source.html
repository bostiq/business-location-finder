<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Source Test</title>
</head>
<body>
    <h1>Data Source Test</h1>
    <div id="results"></div>
    
    <script>
    // Test the unified endpoint directly
    function testDataSource() {
        const wpRoot = 'http://localhost/wp-dev';
        const dataUrl = `${wpRoot}/wp-json/jq-stockists/v1/get-data`;
        
        console.log('Testing unified endpoint:', dataUrl);
        
        fetch(dataUrl)
            .then(res => {
                console.log('Response status:', res.status);
                console.log('Response headers:', res.headers.get('content-type'));
                
                // Check if response is JSON (database) or text (CSV)
                const contentType = res.headers.get('content-type');
                if (contentType && contentType.includes('application/json')) {
                    return res.json().then(data => ({ type: 'json', data }));
                } else {
                    return res.text().then(data => ({ type: 'csv', data }));
                }
            })
            .then(response => {
                console.log('Data response type:', response.type);
                console.log('Data response:', response.data);
                
                const resultsDiv = document.getElementById('results');
                
                if (response.type === 'json') {
                    // Database data
                    const data = response.data;
                    resultsDiv.innerHTML = `
                        <h2>Database Source (JSON)</h2>
                        <p><strong>Success:</strong> ${data.success}</p>
                        <p><strong>Source:</strong> ${data.source}</p>
                        <p><strong>Records:</strong> ${data.data ? data.data.length : 0}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    // CSV data
                    resultsDiv.innerHTML = `
                        <h2>Google Sheets Source (CSV)</h2>
                        <p><strong>Data length:</strong> ${response.data.length} characters</p>
                        <pre>${response.data.substring(0, 500)}...</pre>
                    `;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('results').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            });
    }
    
    // Run test when page loads
    document.addEventListener('DOMContentLoaded', testDataSource);
    </script>
</body>
</html>
